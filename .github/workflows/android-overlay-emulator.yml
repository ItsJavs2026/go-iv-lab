name: Android v0.4 emulator popup and overlay smoke

on:
  pull_request:
    branches: ['candidate/v0.3-popup-presets']
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/android-overlay-emulator.yml'
  workflow_dispatch:

concurrency:
  group: overlay-emulator-v04-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    if: github.event_name != 'pull_request' || github.head_ref == 'experiment/overlay-manual-v0.4'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot Android 15 emulator and test real UI window attachment
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The runner executes each script command separately; use one command
          # rather than a multi-line shell brace group, which fails under /bin/sh.
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload instrumentation results, not private app data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GO-IV-Lab-v0.4-emulator-smoke-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
