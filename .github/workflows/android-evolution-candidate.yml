name: GO IV Lab v0.5 evolution candidate

on:
  push:
    branches: ['experiment/evolution-family-v0.5']
  pull_request:
  workflow_dispatch:

concurrency:
  group: goivlab-v05-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  evolution-test-build:
    if: github.event_name != 'pull_request' || github.head_ref == 'experiment/evolution-family-v0.5'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check phone-only Android Code Studio build script
        run: |
          bash -n scripts/build_goivlab_android_code_studio.sh
          grep -F 'EXPECTED_BRANCH="experiment/evolution-family-v0.5"' scripts/build_goivlab_android_code_studio.sh
          test -f docs/PHONE_BUILD_ANDROID_CODE_STUDIO.md
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run pure evolution, ranking, UI unit tests, Android lint and build
        run: gradle :nickname-core:test :iv-engine:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Verify pinned evolution provenance and packaged offline assets
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/evolution-families.json'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/open-league-pvpoke-rankings.json'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/pokemon-stats.json'
          grep -F 'versionName = "0.5.0-evolution-experiment"' app/build.gradle.kts
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.goivlab.app.overlaylab'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -E 'android.permission.(INTERNET|CAMERA|RECORD_AUDIO|FOREGROUND_SERVICE_MEDIA_PROJECTION)'; then
            echo "Unexpected permission" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GO-IV-Lab-v0.5-evolution-overlay-experiment-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
