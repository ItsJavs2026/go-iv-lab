name: Android candidate APK
on:
  push:
    branches:
      - 'candidate/**'
  pull_request:
  workflow_dispatch:
jobs:
  candidate:
    # Do not package experimental overlay PR code as a stable candidate.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'candidate/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner command-line tools
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run unit tests, Android lint, and package debug candidate
        run: gradle :nickname-core:test :iv-engine:test :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Verify candidate APK and embedded offline dataset
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/pokemon-stats.json'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -Fx 'assets/manifest.json'
      - uses: actions/upload-artifact@v4
        with:
          name: GO-IV-Lab-v0.2-candidate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 21
