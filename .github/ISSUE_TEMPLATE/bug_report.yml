name: Bug report
description: Report a reproducible GO IV Lab issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please redact personal information, Pokémon GO account identifiers, and location data."
  - type: input
    id: version
    attributes:
      label: App version / build
      placeholder: v0.3 candidate
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Galaxy S26 Ultra, Android 17
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include species/form ID, IVs, league and level cap when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - Incorrect calculation or form
        - Crash or install failure
        - Popup or UI problem
        - Nickname or clipboard problem
        - Other
    validations:
      required: true
